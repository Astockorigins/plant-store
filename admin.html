<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin | Plant Store</title>

    <link rel="stylesheet"
          href="style.css">

    <style>

        .admin-page {
            padding: 50px 0 100px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 35px;
        }

        .admin-header h1 {
            color: #245c39;
        }

        .logout-btn {
            border: none;
            background: #b33a3a;
            color: white;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .login-box {
            max-width: 450px;
            margin: 80px auto;
            border: 1px solid #e5ebe6;
            border-radius: 18px;
            padding: 35px;
            background: white;
        }

        .login-box h1 {
            text-align: center;
            color: #245c39;
            margin-bottom: 25px;
        }

        .login-box input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #dce5de;
            border-radius: 10px;
            box-sizing: border-box;
        }

        .login-btn {
            width: 100%;
            border: none;
            background: #2e7d4a;
            color: white;
            padding: 14px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }

        .orders-grid {
            display: grid;
            gap: 20px;
        }

        .order-card {
            background: white;
            border: 1px solid #e5ebe6;
            border-radius: 18px;
            padding: 25px;
        }

        .order-top {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .order-number {
            color: #245c39;
            font-weight: bold;
            font-size: 18px;
        }

        .status {
            padding: 6px 12px;
            border-radius: 20px;
            background: #eef6ef;
            color: #245c39;
            font-size: 13px;
            font-weight: bold;
        }

        .customer-info {
            line-height: 1.7;
            margin-bottom: 15px;
        }

        .order-items {
            border-top: 1px solid #e5ebe6;
            border-bottom: 1px solid #e5ebe6;
            padding: 12px 0;
            margin: 15px 0;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            padding: 7px 0;
        }

        .order-total {
            text-align: right;
            font-size: 20px;
            font-weight: bold;
            color: #245c39;
        }

        .empty-orders {
            text-align: center;
            padding: 60px 20px;
        }

    </style>

</head>


<body>


<header class="header">

    <div class="container nav">

        <a href="index.html"
           class="logo">

            🌿 Plant Store

        </a>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="shop.html">
                Shop
            </a>

        </nav>

    </div>

</header>


<main class="admin-page">

    <div class="container">


        <!-- LOGIN -->

        <div id="login-section"
             class="login-box">

            <h1>
                🌿 Admin Login
            </h1>


            <input
                type="email"
                id="admin-email"
                placeholder="Email">


            <input
                type="password"
                id="admin-password"
                placeholder="Password">


            <button
                class="login-btn"
                onclick="loginAdmin()">

                Login

            </button>


            <p
                id="login-message"
                style="text-align:center;">

            </p>

        </div>


        <!-- DASHBOARD -->

        <div id="dashboard-section"
             style="display:none;">


            <div class="admin-header">

                <div>

                    <h1>
                        📦 Orders
                    </h1>

                    <p>
                        Plant Store Admin Dashboard
                    </p>

                </div>


                <button
                    class="logout-btn"
                    onclick="logoutAdmin()">

                    Logout

                </button>

            </div>


            <div
                id="orders-container"
                class="orders-grid">

                Loading orders...

            </div>


        </div>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>


// ==========================================
// LOGIN
// ==========================================

async function loginAdmin() {

    const email =
        document.getElementById(
            "admin-email"
        ).value.trim();


    const password =
        document.getElementById(
            "admin-password"
        ).value;


    const message =
        document.getElementById(
            "login-message"
        );


    message.textContent =
        "Logging in...";


    const { data, error } =
        await supabaseClient
            .auth
            .signInWithPassword({

                email:
                    email,

                password:
                    password

            });


    if (error) {

        console.error(
            error
        );

        message.textContent =
            "Login failed: " +
            error.message;

        return;

    }


    showDashboard();

}


// ==========================================
// SHOW DASHBOARD
// ==========================================

async function showDashboard() {

    document.getElementById(
        "login-section"
    ).style.display =
        "none";


    document.getElementById(
        "dashboard-section"
    ).style.display =
        "block";


    await loadOrders();

}


// ==========================================
// LOAD ORDERS
// ==========================================

async function loadOrders() {

    const container =
        document.getElementById(
            "orders-container"
        );


    container.innerHTML =
        "Loading orders...";


    const { data, error } =
        await supabaseClient
            .from("orders")
            .select("*")
            .order(
                "created_at",
                {
                    ascending:
                        false
                }
            );


    if (error) {

        console.error(
            error
        );

        container.innerHTML = `

            <div class="empty-orders">

                <h2>
                    Unable to load orders
                </h2>

                <p>
                    ${error.message}
                </p>

            </div>

        `;

        return;

    }


    if (!data || data.length === 0) {

        container.innerHTML = `

            <div class="empty-orders">

                <h2>
                    No orders yet
                </h2>

                <p>
                    Customer orders will appear here.
                </p>

            </div>

        `;

        return;

    }


    container.innerHTML =
        "";


    data.forEach(
        order => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "order-card";


            let itemsHTML =
                "";


            if (
                Array.isArray(
                    order.items
                )
            ) {

                order.items.forEach(
                    item => {

                        itemsHTML += `

                            <div
                                class="order-item">

                                <span>

                                    ${item.name}
                                    ×
                                    ${item.quantity}

                                </span>

                                <strong>

                                    KSh
                                    ${(item.price *
                                      item.quantity)
                                      .toLocaleString()}

                                </strong>

                            </div>

                        `;

                    }
                );

            }


            const orderDate =
                new Date(
                    order.created_at
                ).toLocaleString();


            card.innerHTML = `

                <div class="order-top">

                    <div>

                        <div class="order-number">

                            #${order.order_number}

                        </div>

                        <small>

                            ${orderDate}

                        </small>

                    </div>


                    <span class="status">

                        ${order.order_status}

                    </span>

                </div>


                <div class="customer-info">

                    <strong>
                        Customer
                    </strong>

                    <br>

                    ${order.first_name}
                    ${order.last_name}

                    <br>

                    📞 ${order.phone}

                    <br>

                    ✉️ ${order.email || "No email"}

                    <br>

                    📍 ${order.area}

                    <br>

                    ${order.address}

                    <br>

                    🚚 ${order.delivery_method}

                </div>


                <div class="order-items">

                    ${itemsHTML}

                </div>


                <div class="order-total">

                    Total:
                    KSh
                    ${Number(order.total)
                      .toLocaleString()}

                </div>
<div style="margin-top:20px;">

    <label>
        Order Status
    </label>

    <select
        id="status-${order.id}"
        style="width:100%;padding:10px;margin:8px 0 15px;border-radius:8px;border:1px solid #dce5de;">

        <option value="new"
            ${order.order_status === "new" ? "selected" : ""}>
            New
        </option>

        <option value="confirmed"
            ${order.order_status === "confirmed" ? "selected" : ""}>
            Confirmed
        </option>

        <option value="processing"
            ${order.order_status === "processing" ? "selected" : ""}>
            Processing
        </option>

        <option value="ready"
            ${order.order_status === "ready" ? "selected" : ""}>
            Ready
        </option>

        <option value="delivered"
            ${order.order_status === "delivered" ? "selected" : ""}>
            Delivered
        </option>

    </select>


    <label>
        Payment Status
    </label>

    <select
        id="payment-${order.id}"
        style="width:100%;padding:10px;margin:8px 0 15px;border-radius:8px;border:1px solid #dce5de;">

        <option value="pending"
            ${order.payment_status === "pending" ? "selected" : ""}>
            Pending
        </option>

        <option value="paid"
            ${order.payment_status === "paid" ? "selected" : ""}>
            Paid
        </option>

        <option value="failed"
            ${order.payment_status === "failed" ? "selected" : ""}>
            Failed
        </option>

    </select>


    <button
        onclick="updateOrder(${order.id})"
        style="width:100%;padding:12px;border:none;border-radius:25px;background:#2e7d4a;color:white;font-weight:bold;cursor:pointer;">

        Update Order

    </button>

</div>
            `;


            container.appendChild(
                card
            );

        }
    );

}

async function updateOrder(orderId) {

    const status =
        document.getElementById(
            "status-" + orderId
        ).value;

    const payment =
        document.getElementById(
            "payment-" + orderId
        ).value;


    const { error } =
        await supabaseClient
            .from("orders")
            .update({

                order_status:
                    status,

                payment_status:
                    payment

            })
            .eq(
                "id",
                orderId
            );


    if (error) {

        console.error(error);

        alert(
            "Could not update order: " +
            error.message
        );

        return;

    }


    alert(
        "Order updated successfully."
    );


    await loadOrders();

}
// ==========================================
// LOGOUT
// ==========================================

async function logoutAdmin() {

    await supabaseClient
        .auth
        .signOut();


    document.getElementById(
        "dashboard-section"
    ).style.display =
        "none";


    document.getElementById(
        "login-section"
    ).style.display =
        "block";

}


// ==========================================
// CHECK EXISTING SESSION
// ==========================================

async function checkSession() {

    const { data } =
        await supabaseClient
            .auth
            .getSession();


    if (
        data &&
        data.session
    ) {

        showDashboard();

    }

}


checkSession();


</script>


</body>

</html>
