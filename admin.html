        .orders-grid {
            display: grid;

        .order-card {
            background: white;
            border: 1px solid #e5ebe6;
            border-radius: 18px;
            padding: 25px;

        .order-top {
            display: flex;
            justify-content: space-between;

        .order-number {
            color: #245c39;

        .status {

/* ORDER STATUS COLORS */

.status-new {

}

.status-confirmed {

}

.status-processing {
    background: #fff4d6;
    color: #8a6500;
}

.status-ready {

    color: #6842a5;
}

.status-delivered {
    background: #dff7f0;
    color: #18705b;
}

/* PAYMENT STATUS COLORS */

.status-paid {
    background: #dff7e5;
    color: #23733b;
}

.status-pending {
    background: #fff4d6;
    color: #8a6500;
}

.status-failed {
    background: #ffe4e4;

        .customer-info {

        .order-item {

            justify-content: space-between;

            text-align: right;

        .summary-card {

@media (max-width: 800px) {

// ==========================================
// LOGIN
// ==========================================

async function loginAdmin() {

    const email =
        document.getElementById(
            "admin-email"
        ).value.trim();


    const password =
        document.getElementById(
            "admin-password"
        ).value;


    const message =
        document.getElementById(
            "login-message"
        );


    message.textContent =
        "Logging in...";


    const { data, error } =
        await supabaseClient
            .auth
            .signInWithPassword({

                email:
                    email,

                password:
                    password

            });


    if (error) {

        console.error(
            error
        );

        message.textContent =
            "Login failed: " +
            error.message;

        return;

    }


    showDashboard();

}


// ==========================================
// SHOW DASHBOARD
// ==========================================

async function showDashboard() {

    document.getElementById(
        "login-section"
    ).style.display =
        "none";


    document.getElementById(
        "dashboard-section"
    ).style.display =
        "block";


    await loadOrders();

}

// LOAD ORDERS
// ==========================================
let allOrders = [];
async function loadOrders() {

    const container =
        document.getElementById(
            "orders-container"
        );


    container.innerHTML =
        "Loading orders...";


    const { data, error } =
        await supabaseClient
            .from("orders")
            .select("*")
            .order(
                "created_at",
                {
                    ascending:
                        false
                }
            );


    if (error) {

        console.error(
            error
        );

        container.innerHTML = `

            <div class="empty-orders">

                <h2>
                    Unable to load orders
                </h2>

                <p>
                    ${error.message}
                </p>

            </div>

        `;

        return;

    }

allOrders = data;
    updateOrderSummary();
    if (!data || data.length === 0) {

        container.innerHTML = `

            <div class="empty-orders">

                <h2>
                    No orders yet
                </h2>

                <p>
                    Customer orders will appear here.
                </p>

            </div>

        `;

        return;

    }

        allOrders.filter(

async function updateOrder(orderId) {

    const status =
        document.getElementById(
            "status-" + orderId
        ).value;

    const payment =
        document.getElementById(
            "payment-" + orderId
        ).value;


    const { error } =
        await supabaseClient
            .from("orders")
            .update({

                order_status:
                    status,

                payment_status:
                    payment

            })
            .eq(
                "id",
                orderId
            );


    if (error) {

        console.error(error);

        alert(
            "Could not update order: " +
            error.message
        );

        return;

    }


    alert(
        "Order updated successfully."
    );


    await loadOrders();

}

                        background:#2e7d4a;
                        color:white;
                        font-weight:bold;
                        cursor:pointer;
                    ">

                    Update Order

                </button>

            </div>

        `;


        container.appendChild(card);

    });

}

// ==========================================
// LOGOUT
// ==========================================

async function logoutAdmin() {

    await supabaseClient
        .auth
        .signOut();


    document.getElementById(
        "dashboard-section"
    ).style.display =
        "none";


    document.getElementById(
        "login-section"
    ).style.display =
        "block";

}


// ==========================================
// CHECK EXISTING SESSION
// ==========================================

async function checkSession() {

    const { data } =
        await supabaseClient
            .auth
            .getSession();


    if (
        data &&
        data.session
    ) {

        showDashboard();

    }

}


checkSession();


</script>
